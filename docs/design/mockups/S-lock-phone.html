<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lock screen, phone</title><link rel="stylesheet" href="looks.css"><link rel="stylesheet" href="components.css"><style>body{margin:0}body{margin:0}</style></head><body>

<div class="rl rl-phone" data-palette="flint" data-theme="signal" data-panel-head="plain" data-texture="none" style="width: 390px; height: 844px;">
  <main style="min-height: 844px; background: var(--rl-background-deep); color: var(--rl-text-on-deep); padding: 72px 24px 32px; display: flex; flex-direction: column; gap: 20px;">
    <p class="rl-word" style="font-size: 26px; margin: 0;">Report<b>Log</b></p>
    <p style="margin: 0; color: var(--rl-text-on-deep-muted);">[Optional paragraph from the operator: what this site is and when it opens.]</p>
    <div class="rl-field" style="margin-top: 12px;"><label class="rl-field-label rl-label" for="pw" style="color: var(--rl-text-on-deep);">Password</label><span id="pw" class="rl-input" style="border-color: var(--rl-text-on-deep-muted);">••••••••</span></div>
    <a href="#" class="rl-btn is-primary is-lg is-block">Continue</a>
    <section style="margin-top: 20px; border-top: 1px solid var(--rl-border-on-deep); padding-top: 16px;">
      <h2 class="rl-label" style="margin: 0 0 8px; font-size: 12px; color: var(--rl-text-on-deep-muted);">Open without the password</h2>
      <a href="#" style="display: flex; min-height: 44px; align-items: center; color: var(--rl-text-on-deep);">File a report: Election incidents</a>
    </section>
  </main>
</div>
<script>/* ?look=<id> paints another named look */ const L={"desk": ["platinum", "desk", "title-bar", "none"], "civic": ["flint", "signal", "plain", "none"], "morning-edition": ["newsprint", "broadsheet", "double-rule", "none"], "press-desk": ["press-pass", "docket", "rule", "none"], "field-notes": ["legal-pad", "notebook", "plain", "ruled"], "ranger-station": ["ranger", "trailhead", "plain", "none"], "main-street": ["old-glory", "trailhead", "plain", "none"], "evening-news": ["newsroom", "broadcast", "bar", "none"], "the-firm": ["boardroom", "firm", "plain", "none"], "block-club": ["porch", "commons", "plain", "none"], "green-screen": ["phosphor", "console", "prompt", "none"], "amber-terminal": ["amber", "desk", "title-bar", "none"], "devtools": ["darkroom", "console", "prompt", "none"], "campfire": ["campfire", "trailhead", "plain", "none"], "civic-night": ["midnight", "signal", "plain", "none"], "high-contrast": ["contrast", "commons", "plain", "none"]};const k=new URLSearchParams(location.search).get("look");if(L[k]){const r=document.querySelector(".rl");const[p,t,h,x]=L[k];r.dataset.palette=p;r.dataset.theme=t;r.dataset.panelHead=h;r.dataset.texture=x;}</script></body></html>
