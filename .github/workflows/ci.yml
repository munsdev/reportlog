# Every check that must pass before anything merges. None of them covers
# another: the unit suite never touches a database, the database suite never
# opens a browser, and the browser suite is the only one that walks the site.
name: CI

on:
  push:
    # main, and the branch the rebuild's workstreams merge into, so what is
    # merged there is tested as merged and not only as separate pull requests.
    branches: [main, ccr-c9c93698-ev856l]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/reportlog
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  checks:
    name: Lint, types, boundaries, unit and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reportlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The backup tests run what the server runs: pg_dump and pg_restore
      # (16, to match the service) and age to encrypt the off-site copy.
      - name: Backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age postgresql-client-16
      - name: Deploy scripts pass ShellCheck
        run: shellcheck -x -P SCRIPTDIR deploy/*.sh deploy/bin/reportlog
      # The deploy tests run the shipped Caddyfile in a real Caddy, and the
      # storage check against moto (an S3 server this repository did not
      # write). Both fail rather than skip in CI. Caddy's SHA-256 is of the
      # release tarball, whose SHA-512 is in Caddy's published checksums.
      - name: Caddy and moto for the deploy tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/caddy.tgz" https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz
          echo "5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  $RUNNER_TEMP/caddy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tgz" -C "$RUNNER_TEMP" caddy
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.0.28"
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >>"$GITHUB_ENV"
          echo "MOTO_SERVER=$RUNNER_TEMP/moto/bin/moto_server" >>"$GITHUB_ENV"
      # secret-scan.test.ts plants keys in repositories of its own and checks
      # the scan below fails on each. The same pinned gitleaks as that job.
      - name: gitleaks for the secret scan's own test
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks" >>"$GITHUB_ENV"
      # The media worker's tools (files workstream): its tests re-encode real
      # photos, video, sound and PDFs, and fail rather than skip in CI.
      - name: Media tools
        run: sudo apt-get install -yq --no-install-recommends imagemagick libheif1 ffmpeg poppler-utils
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm test
      - name: Database types match the migrations
        run: pnpm --filter @reportlog/api db:types:check
      - run: pnpm test:db

  # No key, password or token is ever committed (docs/decisions.md, "Keys
  # and secrets"). The WHOLE history is scanned, not only this change: a key
  # removed in a later commit is still in the repository. A finding means the
  # key is leaked: rotate it, then remove it. .gitleaks.toml says what is
  # scanned for and allows, value by value, the few things that only look
  # like keys. gitleaks is pinned like Caddy above: the SHA-256 is of the
  # release tarball, as listed in gitleaks' published checksums file.
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: No secret in any commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reportlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The media worker's tools (files workstream): its tests re-encode real
      # photos, video, sound and PDFs, and fail rather than skip in CI.
      - name: Media tools
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends imagemagick libheif1 ffmpeg poppler-utils
      - run: pnpm --filter @reportlog/api db:migrate
      - run: pnpm --filter @reportlog/web exec playwright install --with-deps chromium
      - run: pnpm --filter @reportlog/web e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
