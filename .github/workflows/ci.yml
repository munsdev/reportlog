# Every check that must pass before anything merges. None of them covers
# another: the unit suite never touches a database, the database suite never
# opens a browser, and the browser suite is the only one that walks the site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/reportlog
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  checks:
    name: Lint, types, boundaries, unit and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reportlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The backup tests run what the server runs: pg_dump and pg_restore
      # (16, to match the service) and age to encrypt the off-site copy.
      - name: Backup tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age postgresql-client-16
      - name: Deploy scripts pass ShellCheck
        run: shellcheck -x -P SCRIPTDIR deploy/*.sh deploy/bin/reportlog
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm test
      - name: Database types match the migrations
        run: pnpm --filter @reportlog/api db:types:check
      - run: pnpm test:db

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reportlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reportlog/api db:migrate
      - run: pnpm --filter @reportlog/web exec playwright install --with-deps chromium
      - run: pnpm --filter @reportlog/web e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
