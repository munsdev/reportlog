# The Content-Security-Policy, in ONE place. reportlog.conf includes this file
# twice: in the server block and in `location = /sw.js`, because an add_header
# inside a location replaces everything inherited from the server.
#
# It lives in the checkout so a release that changes the policy arrives with
# `git pull`, and deploy.sh reloads nginx for it. Nobody pastes the string.
#
# `script-src 'self'` is the point of it, and it works only because no page in
# public/ carries inline script - there is no nonce to be had, since nginx
# serves these files off disk and never renders them.
#
# `always`, so it is sent on error responses too.
#
# No default-src on purpose: uploads go browser-to-bucket and attachments come
# back from that bucket, whose origin differs per deployment, so img-src and
# connect-src are left alone rather than guessed. server.js states the same
# policy for the paths it answers; `npm test` checks the two agree.
#
# `style-src 'self'` has no 'unsafe-inline': the markup carries no inline `style`
# attribute. A script may still set one through the CSSOM (`el.style.x = ...`),
# which the policy does not govern. server.js says the rest.
add_header Content-Security-Policy "script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
