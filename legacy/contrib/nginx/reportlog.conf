# nginx for a ReportLog deployment.
#
# THE SPLIT THAT MATTERS. nginx serves public/ off disk and everything the
# APP answers has to be proxied, or nginx 404s it before Node ever sees the
# request. That is the one mistake worth warning about, because it looks
# like the app being broken rather than the proxy.
#
# Get a certificate first (certbot --nginx will write the 443 block and the
# redirect for you), then paste the body of this file into the server block
# it made. Editing certbot's file beats replacing it: delete and rewrite and
# the certificate wiring goes too.
#
# Replace reports.example.org and /srv/reportlog. Port 5000 is the default
# in .env.example; match whatever PORT you set.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reports.example.org;

    # certbot writes these two. Keep its lines rather than these.
    # ssl_certificate     /etc/letsencrypt/live/reports.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/reports.example.org/privkey.pem;

    root /srv/reportlog/public;
    index index.html;

    # The Content-Security-Policy lives in ONE file in the checkout, so a
    # release that changes the policy reaches the box with `git pull` and
    # deploy.sh reloads nginx for it. Pasting the string here instead meant
    # a hand edit on every release that touched it, and a box that quietly
    # kept serving the old one. The file is contrib/nginx/csp.conf; it
    # explains the policy.
    #
    # Included again inside = /sw.js below: an add_header anywhere in a
    # location REPLACES everything inherited from the server, so a location
    # that sets one header loses this.
    include /srv/reportlog/contrib/nginx/csp.conf;

    # Scripts, styles and the page itself: a browser may keep them but must
    # ask before using one. The file says why — a stale script once left an
    # owner looking at a white page.
    include /srv/reportlog/contrib/nginx/cache.conf;

    # Uploads go browser-to-bucket directly, so nothing large passes
    # through here. express.json caps bodies at 256kb; 1m is ample and
    # worth stating rather than leaving to the default.
    client_max_body_size 1m;

    # The app writes one request line with no IP address, no query string
    # and no raw path. Debian's `combined` default undoes all of that, so
    # this turns it off here and lets the app be the only thing logging.
    # If you want an access log, write a format that carries none of the
    # four — see contrib/nginx/privacy-log.conf.
    access_log off;

    # --- everything the app answers itself ---------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # server.js sets trust proxy, and req.secure comes from this. Get it
        # wrong and every cookie it sets with `secure: true` is dropped.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The install guide. Without this, /docs falls through to try_files and
    # renders the app instead; /docs.html is served off disk either way.
    location = /docs {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The style guide, same arrangement as /docs: /styleguide.html is served
    # off disk either way, and this only adds the tidier address.
    location = /styleguide {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The manifest carries the deployment's NAME and its palette's two
    # colours, so it is built per deployment and cannot be served from disk.
    # Without this block a home-screen icon is labelled ReportLog on every
    # installation that is not called ReportLog.
    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the single-page app -----------------------------------------
    # /board, /about/changelog, /r/EL-XXXX and the rest are real URLs the
    # frontend routes. Anything that is not a file has to return
    # index.html, or a deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A stale service worker pins people to an old shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        # Repeated, not inherited: the add_header above drops the server-level
        # one. Without this line the service worker is the one file served
        # with no policy.
        include /srv/reportlog/contrib/nginx/csp.conf;
        try_files $uri =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name reports.example.org;
    return 301 https://$host$request_uri;
}
