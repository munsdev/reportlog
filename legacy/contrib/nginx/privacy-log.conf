# If you want an nginx access log, use one that does not undo what the app
# is careful about.
#
# Debian's `combined` default writes the client address, the query string,
# the referer and the user agent for every request. On a site that exists so
# people can report things without being identified, that is a visitor list.
#
# Put the format at http level (/etc/nginx/nginx.conf, in the http block), and
# `access_log off;` beside it so a site added later is silent until somebody
# gives it a format deliberately.

log_format privacy '$time_iso8601 $status $request_method $uri '
                   '$body_bytes_sent $request_time';

# Then in the site's server block, opt in:
#
#     access_log /var/log/nginx/reportlog.log privacy;
#
# and leave /api off entirely — the app logs those itself, with route
# templates and keyed digests rather than paths and addresses:
#
#     location /api/ ... access_log off;
