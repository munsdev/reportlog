# The extra line a TEST deployment wants, on top of reportlog.conf.
#
# A gated instance under a name people recognise must never turn up in
# search results. Add this inside the 443 server block.
#
# WHY A HEADER AND NOT A META TAG. nginx serves public/ directly, so a
# header the app sets on an HTML response is one production never sends.
# A header also covers the press PDFs, the documents zip and the API, which
# a meta tag cannot.
#
# `always` matters: without it the header is dropped on error responses,
# which are exactly what a crawler hits on a gated instance.

add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

# AND KNOW WHAT IT IS NOT. server.js serves index.html for any non-API path
# whatever the lock state, because the lock screen is drawn client side. A
# crawler fetching / on a gated instance gets a 200 with the full page in
# the body. This stops it being INDEXED. It is not access control and must
# never be counted as any.
