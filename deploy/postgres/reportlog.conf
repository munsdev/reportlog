# Installed by deploy/install.sh into /etc/postgresql/<major>/main/conf.d/.
#
# No TCP listener at all, not even on localhost. Everything that talks to the
# database (the API, the jobs, the backup, the doctor) runs on this machine as
# the `reportlog` user and connects over the Unix socket in
# /var/run/postgresql, where PostgreSQL's default peer authentication lets
# that user in as the role of the same name, with no password to leak.
listen_addresses = ''
