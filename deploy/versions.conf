# Everything the server runs that is not in the lockfile, pinned.
#
# Read by install.sh (and by the doctor, which warns when the box has drifted
# from what is written here). Changing a line here is a code change: it goes
# through review like any other, and takes effect when install.sh is run again.

# Node.js: an exact release, and the SHA-256 of each tarball as published in
# https://nodejs.org/dist/v<version>/SHASUMS256.txt. install.sh refuses a
# download whose hash differs. Hetzner sells both x64 and Arm (CAX) servers.
NODE_VERSION=22.23.3
NODE_SHA256_X64=df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de
NODE_SHA256_ARM64=a44aeb94849a299b22df10b9e622ec2f605c2183501bc40590705131de7c740f

# PostgreSQL: the major version, from the PostgreSQL project's own apt
# repository. Minor (security) releases arrive through unattended-upgrades;
# a major upgrade is a deliberate dump-and-restore, never automatic.
POSTGRES_MAJOR=16

# Signing keys, by full fingerprint. A key fetched over HTTPS is still
# checked against these before apt is told to trust it.
PGDG_KEY_URL=https://www.postgresql.org/media/keys/ACCC4CF8.asc
PGDG_KEY_FINGERPRINT=B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
CADDY_KEY_URL=https://dl.cloudsmith.io/public/caddy/stable/gpg.key
CADDY_KEY_FINGERPRINT=65760C51EDEA2017CEA2CA15155B6D79CA56EA34
