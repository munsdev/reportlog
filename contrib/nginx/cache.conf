# HOW LONG A BROWSER MAY KEEP THE SITE'S OWN FILES: it may keep them, but it
# must ask before using one (`no-cache` is "revalidate", not "do not store").
# An unchanged file costs a 304 and no download.
#
# WHY. Without this nginx sends no caching instruction for /js/ and /css/, so
# a browser guesses how long a file is fresh. On 10 October an owner's
# browser kept one OLD module beside new ones after an update; the missing
# export stopped every script and the page stayed white. The service worker
# and public/js/boot-guard.js now cope with that in the browser; this stops
# it at the source, including for a browser with no service worker yet.
#
# Included ONCE, in the server block of reportlog.conf, beside csp.conf:
#
#     include /srv/reportlog/contrib/nginx/cache.conf;
#
# It holds LOCATION blocks, which is allowed at that level. Each repeats the
# csp.conf include, because an add_header inside a location replaces every
# one inherited from the server — the same reason `location = /sw.js` does.
#
# A regular-expression location, so it wins over `location /` for these
# files and loses to the exact ones (`= /sw.js`, `= /docs`, …), which keep
# their own rules. Nothing under /api/ ends in .js, .css or .html.
location ~* \.(?:js|css|html)$ {
    include /srv/reportlog/contrib/nginx/csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
